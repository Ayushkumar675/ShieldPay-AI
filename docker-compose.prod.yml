version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    restart: always
    volumes:
      - mongodb_data_prod:/data/db
    networks:
      - shieldpay-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
    networks:
      - shieldpay-net
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    networks:
      - shieldpay-net
    depends_on:
      - backend

networks:
  shieldpay-net:

volumes:
  mongodb_data_prod:
