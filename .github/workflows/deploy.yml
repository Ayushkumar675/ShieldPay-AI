name: ShieldPay AI Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: pip install -r backend/requirements.txt

      # Optionally add a test step for backend
      # - name: Run PyTest
      #   run: pytest backend/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build and Push containers (Example)
        run: |
          # This is a placeholder for actual docker compose push or deployment commands
          # For example, deploying via SSH or pushing to an ECR/DockerHub registry
          docker compose -f docker-compose.prod.yml build
          echo "Build successful! Ready for manual or automated rollout."
